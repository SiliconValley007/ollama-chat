      function renderToolActivity(container, data) {
        const label = {
          read_file: "📖 Reading", write_file: "📝 Writing", edit_file: "✏️ Editing",
          execute_command: "⚙️ Running", search_codebase: "🔎 Searching"
        }[data.tool] || ("🔧 " + data.tool);
        if (data.type === "tool_start") {
          const detail = data.args && (data.args.path || data.args.command || data.args.query) || "";
          const el = document.createElement("div");
          el.className = "tool-activity";
          el.dataset.callId = data.callId;
          el.innerHTML = '<span class="tool-activity-spinner"></span><span>' + label + ' ' + escHtml(String(detail)) + '…</span>';
          container.appendChild(el);
        } else if (data.type === "tool_end") {
          const el = container.querySelector('[data-call-id="' + CSS.escape(String(data.callId)) + '"]');
          if (!el) return;
          el.innerHTML = (data.ok ? "✅ " : "⚠️ ") + label.replace(/^[^\s]+\s/, "") +
            (data.ok ? "" : " — " + escHtml(data.preview || "failed"));
          el.classList.add(data.ok ? "tool-activity-ok" : "tool-activity-err");

      function renderDiffCard(container, data) {
        const card = document.createElement("div");
        card.className = "diff-card";
        const header = document.createElement("div");
        header.className = "diff-card-header";
        header.innerHTML = (data.isNew ? "🆕 New file: " : "✏️ Change to: ") + "<code>" + escHtml(data.path) + "</code>";
        card.appendChild(header);

        const body = document.createElement("div");
        body.className = "diff-card-body";
        data.diff.forEach((part) => {
          const line = document.createElement("pre");
          line.className = part.added ? "diff-line diff-add" : part.removed ? "diff-line diff-remove" : "diff-line";
          line.textContent = part.value;
          body.appendChild(line);
        });
        card.appendChild(body);

        const actions = document.createElement("div");
        actions.className = "diff-card-actions";
        const approveBtn = document.createElement("button");
        approveBtn.className = "diff-btn diff-approve";
        approveBtn.textContent = "✅ Approve";
        const rejectBtn = document.createElement("button");
        rejectBtn.className = "diff-btn diff-reject";
        rejectBtn.textContent = "❌ Reject";
        const decide = async (approve) => {
          approveBtn.disabled = true; rejectBtn.disabled = true;
          await fetch("/api/chat/diff-approve", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ pendingId: data.pendingId, approve })
          });
          card.classList.add(approve ? "diff-decided-approve" : "diff-decided-reject");
          actions.innerHTML = approve ? "Approved" : "Rejected";
        };
        approveBtn.onclick = () => decide(true);
        rejectBtn.onclick = () => decide(false);
        actions.appendChild(approveBtn);
        actions.appendChild(rejectBtn);
        card.appendChild(actions);

        container.appendChild(card);

      // ── Copy message ──────────────────────────────────────────────────────────────
      async function copyMessage(btn) {
        const bubble = btn
          .closest(".message-wrapper")
          .querySelector(".msg-bubble");
        const text = bubble.innerText;
        try {
          await navigator.clipboard.writeText(text);
          const orig = btn.innerHTML;
          btn.innerHTML = "✓ Copied!";
          setTimeout(() => (btn.innerHTML = orig), 1500);
        } catch {
          showToast("Copy failed");
        }
      }

      // ── Edit message ──────────────────────────────────────────────────────────────
      function editMessage(btn, msgId) {
        const wrapper = btn.closest(".message-wrapper");
        const bubble = wrapper.querySelector(".msg-bubble");
        const currentText = bubble.innerText.trim();
        const actions = wrapper.querySelector(".msg-actions");

        const ta = document.createElement("textarea");
        ta.className = "edit-textarea";
        ta.value = currentText;
        setTimeout(() => {
          ta.style.height = "auto";
          ta.style.height = ta.scrollHeight + "px";
        }, 0);

        const editActions = document.createElement("div");
        editActions.className = "edit-actions";
        editActions.innerHTML =
          '<button class="edit-btn edit-btn-save" onclick="saveEdit(this,\'' +
          msgId +
          "')\">Save & Resend</button>" +
          '<button class="edit-btn edit-btn-cancel" onclick="cancelEdit(this)">Cancel</button>';

        bubble.replaceWith(ta);
        actions.replaceWith(editActions);
        ta.focus();
      }

      async function saveEdit(btn, msgId) {
        const wrapper = btn.closest(".message-wrapper");
        const ta = wrapper.querySelector(".edit-textarea");
        const newText = ta.value.trim();
        if (!newText) return;

        // Delete this message and everything after it from DB
        await fetch(
          "/api/conversations/" + currentConvId + "/messages-from/" + msgId,
          { method: "DELETE" },
        );

        // Remove all message wrappers from this point onward in the DOM
        const inner = document.getElementById("messages-inner");
        const allWrappers = Array.from(
          inner.querySelectorAll(".message-wrapper"),
        );
        let found = false;
        allWrappers.forEach((w) => {
          if (w === wrapper || found) {
            found = true;
            w.remove();
          }
        });

        // Resend
        document.getElementById("message-input").value = newText;
        sendMessage(newText);
      }

      function cancelEdit(btn) {
        const wrapper = btn.closest(".message-wrapper");
        const ta = wrapper.querySelector(".edit-textarea");
        const editActions = btn.closest(".edit-actions");
        const originalText = ta.value;

        const bubble = document.createElement("div");
        bubble.className = "msg-bubble";
        bubble.innerHTML = escHtml(originalText).replace(/\n/g, "<br>");
        ta.replaceWith(bubble);

        const msgId = wrapper.dataset.msgId || "";
        const actions = document.createElement("div");
        actions.className = "msg-actions";
        actions.innerHTML =
          '<button class="msg-action" onclick="copyMessage(this)">📋 Copy</button>' +
          (msgId
            ? '<button class="msg-action" onclick="editMessage(this,\'' +
              msgId +
              "')\">✏️ Edit</button>"
            : "");
        editActions.replaceWith(actions);
      }

      // ── Regenerate ────────────────────────────────────────────────────────────────
      async function regenerateFrom(msgId) {
        if (isStreaming) return;
        // Delete this assistant message and everything after from DB
        await fetch(
          "/api/conversations/" + currentConvId + "/messages-from/" + msgId,
          { method: "DELETE" },
        );

        // Remove from DOM
        const inner = document.getElementById("messages-inner");
        const allWrappers = Array.from(
          inner.querySelectorAll(".message-wrapper"),
        );
        let found = false;
        allWrappers.forEach((w) => {
          if (w.dataset.msgId === msgId || found) {
            found = true;
            w.remove();
          }
        });

        // Get the last user message content to resend
        const remaining = Array.from(
          inner.querySelectorAll(".message-wrapper.user"),
        );
        if (!remaining.length) return;
        const lastUser = remaining[remaining.length - 1];
        const lastContent = lastUser
          .querySelector(".msg-bubble")
          .innerText.trim();
                const lastMsgId = lastUser.dataset.msgId;

        document.getElementById("message-input").value = lastContent;
        sendMessage(lastContent);
      }

      let projectRoot = null;
      let projectFileCount = 0;

      // Populates the sidebar tree + button state for a given folder path. Used both
      // when the user manually opens a folder and when a loaded conversation restores
      // one automatically. Returns true on success, false if the folder is missing —
      // callers decide how to surface that (toast vs. silent) without breaking chat,
      // since the server already falls back gracefully to "no project" either way.
      async function openProjectFolderUI(folderPath, { openPanel = true, silent = false } = {}) {
        try {
          const r = await fetch('/api/project/open', {
            method: 'POST', headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ path: folderPath })
          });
          const data = await r.json();
          if (data.error) {
            projectRoot = null;
            document.getElementById('project-btn').classList.remove('active');
            document.getElementById('project-btn-label').textContent = '📁 Open Project Folder';
            document.getElementById('project-btn-clear').style.display = 'none';
            document.getElementById('projectPanel').classList.remove('open');
            const badge = document.getElementById("conv-project-badge");
            if (badge && !silent) {
              badge.textContent = "⚠ Project folder not found";
              badge.title = folderPath + " — no longer exists at this path";
              badge.style.display = "inline-block";
            }
            if (!silent) showToast('Project folder not found: ' + folderPath, 4000);
            return false;
          }
          projectRoot = data.path;
          projectFileCount = countFiles(data.tree);
          const tree = document.getElementById('projectTree');
          tree.innerHTML = '';
          renderTree(data.tree, tree);
          const countEl = document.getElementById('projectFileCount');
          countEl.innerHTML = '';
          countEl.textContent = projectFileCount + ' files • ' + folderPath;
          countEl.insertAdjacentHTML('afterend',
            '<button id="reindex-btn" title="Re-index for semantic search" style="margin-left:8px;background:none;border:none;color:var(--text-dim);cursor:pointer;">🔄</button>');
          document.getElementById('reindex-btn').onclick = () => {
            fetch('/api/project/index', {
              method: 'POST', headers: {'Content-Type':'application/json'},
              body: JSON.stringify({ path: projectRoot })
            }).catch(() => {});
            showToast('Re-indexing started...');
          };
          document.getElementById('project-btn-label').textContent = '📂 ' + folderPath.split(/[\\/]/).pop();
          document.getElementById('project-btn-clear').style.display = 'inline';
          document.getElementById('project-btn').classList.add('active');
          if (openPanel) document.getElementById('projectPanel').classList.add('open');
          return true;
        } catch {
          if (!silent) showToast('Could not reach server to open project folder', 3000);
          return false;
        }
      }

      document.getElementById('project-btn').onclick = async (e) => {
        if (e.target.id === 'project-btn-clear') {
          projectRoot = null;
          document.getElementById('project-btn').classList.remove('active');
          document.getElementById('project-btn-label').textContent = '📁 Open Project Folder';
          document.getElementById('project-btn-clear').style.display = 'none';
          document.getElementById('projectPanel').classList.remove('open');
          return;
        }
        const panel = document.getElementById('projectPanel');
        if (projectRoot) { panel.classList.toggle('open'); return; }
        const folderPath = prompt('Absolute path to project folder:');
        if (!folderPath) return;
        const ok = await openProjectFolderUI(folderPath, { openPanel: true });
        if (ok) {
          fetch('/api/project/index', {
            method: 'POST', headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ path: projectRoot })
          }).catch(() => {});
        }
      };

      function countFiles(nodes) {
        return nodes.reduce((n, x) => n + (x.type === 'dir' ? countFiles(x.children) : 1), 0);
      }

      async function previewProjectFile(relPath) {
        const fullPath = projectRoot + (projectRoot.includes('\\') ? '\\' : '/') + relPath;
        const r = await fetch('/api/project/file?path=' + encodeURIComponent(fullPath) + '&root=' + encodeURIComponent(projectRoot));
        const data = await r.json();
        if (data.error) { alert(data.error); return; }
        showFilePreviewModal(relPath, data.content); // simple <pre> in a modal/panel
      }

      function renderTree(nodes, container) {
        const ul = document.createElement('ul');
        for (const node of nodes) {
          const li = document.createElement('li');
          if (node.type === 'dir') {
            const label = document.createElement('div');
            label.className = 'dir-label';
            label.textContent = '📁 ' + node.name;
            const childWrap = document.createElement('div');
            childWrap.style.display = 'none';
            label.onclick = () => { childWrap.style.display = childWrap.style.display === 'none' ? 'block' : 'none'; };
            renderTree(node.children, childWrap);
            li.appendChild(label); li.appendChild(childWrap);
          } else {
            const label = document.createElement('div');
            label.className = 'file-label';
            label.textContent = '📄 ' + node.name;
            label.style.cursor = 'pointer';
            label.onclick = () => previewProjectFile(node.path);
            li.appendChild(label);
          }
          ul.appendChild(li);
        }
        container.appendChild(ul);
      }

      // ── Send Message ──────────────────────────────────────────────────────────────
      async function sendSteeringNote(note) {
        if (!currentConvId || !note.trim()) return;
        await fetch('/api/chat/steer', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ conversationId: currentConvId, note })
        });
      }
      async function sendMessage(overrideText) {
        const input = document.getElementById("message-input");
        const text = (overrideText || input.value).trim();
        if ((!text && pendingFiles.length === 0) || isStreaming) return;

        if (!currentConvId) {
          try {
            const r = await fetch("/api/conversations", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ model: currentModel }),
            });
            const conv = await r.json();
            currentConvId = conv.id;
            document.getElementById("export-btn").style.display = "flex";
          } catch {
            showToast("Failed to create conversation");
            return;
          }
        }

        const welcome = document.getElementById("welcome");
        if (welcome) welcome.remove();
        const inner = document.getElementById("messages-inner");

        // Build user bubble immediately
        const userWrapper = document.createElement("div");
        userWrapper.className = "message-wrapper user";

        // previewUrl is already a data URL (set at file-select time)
        const dataUrls = pendingFiles.map((item) => item.previewUrl || null);

        // Build user bubble using DOM methods (not innerHTML) so data URLs are safe
        userWrapper.innerHTML =
          '<div class="msg-header user-header"><div class="msg-avatar avatar-user">👤</div><span>You</span></div>' +
          '<div class="msg-bubble user"></div>' +
          '<div class="msg-actions"><button class="msg-action" onclick="copyMessage(this)">📋 Copy</button></div>';

        const bubble = userWrapper.querySelector(".msg-bubble");

        if (pendingFiles.length) {
          const attDiv = document.createElement("div");
          attDiv.className = "msg-attachments";
          pendingFiles.forEach((item, idx) => {
            const dataUrl = dataUrls[idx];
            if (dataUrl) {
              const img = document.createElement("img");
              img.src = dataUrl; // safe — set via property, not attribute string
              img.alt = item.file.name;
              img.title = "Click to enlarge";
              img.style.cursor = "zoom-in";
              img.addEventListener("click", () => openLightbox(img.src));
              attDiv.appendChild(img);
            } else {
              const chip = document.createElement("div");
              chip.className = "msg-file-chip";
              const isPdf = item.file.type === "application/pdf";
              const icon = isPdf
                ? "📄"
                : isImageFile(item.file)
                  ? "🖼"
                  : getFileIcon(item.file.name);
              chip.innerHTML =
                icon +
                " " +
                escHtml(item.file.name) +
                ' <span style="color:var(--text3);font-size:10px;margin-left:4px">' +
                formatFileSize(item.file.size) +
                "</span>";
              if (isPdf) {
                chip.style.cursor = "pointer";
                chip.title = "Click to open PDF";
                chip.addEventListener("click", () => openPdfPreview(item.file));
              }
              attDiv.appendChild(chip);
            }
          });
          bubble.appendChild(attDiv);
        }

        if (text) {
          const textNode = document.createElement("span");
          textNode.innerHTML = escHtml(text).replace(/\n/g, "<br>");
          bubble.appendChild(textNode);
        }

        inner.appendChild(userWrapper);
        scrollToBottom();

        const formData = new FormData();
        formData.append("conversationId", currentConvId);
        formData.append("message", text);
        formData.append("model", currentModel);
        formData.append('projectRoot', projectRoot || '');
        pendingFiles.forEach((item) =>
          formData.append("files", item.file, item.file.name),
        );

        input.value = "";
        onInputChange(input);
        clearAttachments();

        const typingEl = appendTypingIndicator();
        setStreaming(true);

        const statusWrap = document.createElement("div");
        statusWrap.className = "status-line";
        statusWrap.innerHTML =
          '<span class="status-spinner"></span>' +
          '<span class="status-text">Working…</span>' +
          '<span class="status-timer">0s</span>' +
          '<span class="status-chevron">▾</span>';
        const statusDetail = document.createElement("div");
        statusDetail.className = "status-detail";
        statusDetail.style.display = "none";
        statusWrap.onclick = () =>
          (statusDetail.style.display = statusDetail.style.display === "none" ? "block" : "none");
        inner.appendChild(statusWrap);
        inner.appendChild(statusDetail);
        const turnStartedAt = Date.now();
        const statusTimerInt = setInterval(() => {
          statusWrap.querySelector(".status-timer").textContent =
            Math.round((Date.now() - turnStartedAt) / 1000) + "s";
        }, 1000);

        let buffer = "";
        let streamWrapper = null;
        let streamBubble = null;
        let newMsgId = null;
        abortController = new AbortController();
        let lastEventAt = Date.now();
        const stallTimer = setInterval(() => {
          if (Date.now() - lastEventAt > 15000) {
            statusWrap.querySelector(".status-text").textContent = "⚠ No update for 15s — may be stuck";
            clearInterval(stallTimer);
          }
        }, 5000);

        try {
          const response = await fetch("/api/chat", {
            method: "POST",
            body: formData,
            signal: abortController.signal,
          });
          if (!response.ok) {
            let msg = "Request failed (" + response.status + ")";
            try { msg = (await response.json()).error || msg; } catch {}
            if (typingEl.parentNode) typingEl.remove();
            appendErrorMessage(msg, () => sendMessage(overrideText));
            clearInterval(stallTimer);
            setStreaming(false);
            return;
          }
          const reader = response.body.getReader();
          const decoder = new TextDecoder();
          let partial = "";

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            partial += decoder.decode(value, { stream: true });
            const lines = partial.split("\n");
            partial = lines.pop();
            for (const line of lines) {
              if (!line.startsWith("data: ")) continue;
              try {
                const data = JSON.parse(line.slice(6));
                if (data.error) {
                  if (typingEl.parentNode) typingEl.remove();
                  appendErrorMessage(data.error, () => sendMessage(overrideText));
                  setStreaming(false);
                  return;
                }
                if (data.type === "tool_start" || data.type === "tool_end") {
                  if (typingEl.parentNode) typingEl.remove();
                  lastEventAt = Date.now();
                  if (data.type === "tool_start") {
                    const label = { read_file: "Reading", write_file: "Writing", edit_file: "Editing",
                      execute_command: "Running", search_codebase: "Searching" }[data.tool] || data.tool;
                    const detail = (data.args && (data.args.path || data.args.command || data.args.query)) || "";
                    statusWrap.querySelector(".status-text").textContent = label + (detail ? " " + detail : "") + "…";
                  }
                  renderToolActivity(statusDetail, data);
                  scrollToBottomIfNearBottom();
                  continue;
                }
                if (data.type === "diff_pending") {
                  if (typingEl.parentNode) typingEl.remove();
                  renderDiffCard(inner, data);
                  scrollToBottomIfNearBottom();
                  continue;
                }
                if (data.type === "command_pending") {
                  if (typingEl.parentNode) typingEl.remove();
                  renderCommandCard(inner, data);
                  scrollToBottomIfNearBottom();
                  continue;
                }
                if (data.type === "model_used" || data.modelUsed || data.model_used) {
                  const m = data.model || data.modelUsed || data.model_used;
                  currentModel = m;
                  localStorage.setItem("lastModel", m);
                  document.getElementById("model-badge").textContent = m;
                  continue;
                }
                if (data.type === "model_fallback") {
                  showToast("Switching model (previous one failed)...");
                  continue;
                }
                if (data.type === "steer_note") {
                  renderSteerNote(inner, data.note);
                  scrollToBottomIfNearBottom();
                  continue;
                }
                if (data.type === "stream_reset") {
                  buffer = "";
                  if (streamWrapper) { streamWrapper.remove(); streamWrapper = null; streamBubble = null; }
                  continue;
                }
                if (data.token) {
                  lastEventAt = Date.now();
                  statusWrap.querySelector(".status-text").textContent = "Writing response…";
                  if (!streamWrapper) {
                    if (typingEl.parentNode) typingEl.remove();
                    streamWrapper = document.createElement("div");
                    streamWrapper.className = "message-wrapper assistant";
                    streamWrapper.innerHTML =
                      '<div class="msg-header"><div class="msg-avatar avatar-ai">✦</div><span>Assistant</span></div>' +
                      '<div class="msg-bubble markdown-body streaming-cursor"></div>' +
                      '<div class="msg-actions"></div>';
                    inner.appendChild(streamWrapper);
                    streamBubble = streamWrapper.querySelector(".msg-bubble");
                  }
                  buffer += data.token;
                  streamBubble.innerHTML = renderMarkdown(buffer);
                  scrollToBottomIfNearBottom();
                }
                if (data.done) {
                  newMsgId = data.messageId;
                  if (streamBubble) {
                    streamBubble.classList.remove("streaming-cursor");
                    streamBubble.innerHTML = renderMarkdown(buffer);
                    hljs.highlightAll();
                  }
                  if (streamWrapper && newMsgId) {
                    streamWrapper.dataset.msgId = newMsgId;
                    streamWrapper.querySelector(".msg-actions").innerHTML =
                      '<button class="msg-action" onclick="copyMessage(this)">📋 Copy</button>' +
                      '<button class="msg-action" onclick="regenerateFrom(\'' +
                      newMsgId +
                      "')\">🔄 Regenerate</button>";
                    lastAssistantMsgId = newMsgId;
                  }
                  clearInterval(stallTimer);
                  clearInterval(statusTimerInt);
                  statusWrap.classList.add("status-done");
                  statusWrap.querySelector(".status-text").textContent =
                    "Worked for " + statusWrap.querySelector(".status-timer").textContent;
                  setStreaming(false);
                  await loadConversations();
                  try {
                    const conv = await fetch(
                      "/api/conversations/" + currentConvId,
                    ).then((r) => r.json());
                    document.getElementById("conv-title-display").textContent =
                      conv.title;
                  } catch {}
                }
              } catch (_) {}
            }
          }
        } catch (err) {
          clearInterval(stallTimer);
          clearInterval(statusTimerInt);
          if (statusWrap.parentNode) statusWrap.remove();
          if (statusDetail.parentNode) statusDetail.remove();
          if (err.name === "AbortError") {
            if (typingEl.parentNode) typingEl.remove();
            if (streamBubble) streamBubble.classList.remove("streaming-cursor");
          } else {
            if (typingEl.parentNode) typingEl.remove();
            appendErrorMessage("Connection error: " + err.message);
          }
          setStreaming(false);
        }
      }

      function stopGeneration() {
        if (abortController) {
          abortController.abort();
          abortController = null;
        }
        setStreaming(false);
        showToast("Generation stopped");
      }

      function setStreaming(val) {
        isStreaming = val;
        document.getElementById("send-btn").disabled = val;
        document.getElementById("send-btn").style.display = val
          ? "none"
          : "flex";
        document.getElementById("stop-btn").style.display = val
          ? "flex"
          : "none";
        document.getElementById('steer-bar').style.display = (val && projectRoot) ? 'flex' : 'none';
        setStatus(val ? "streaming" : "online");
      }

      function sendSuggestion(btn) {
        document.getElementById("message-input").value = btn.textContent;
        document.getElementById("message-input").focus();
      }

      // ── Modal ─────────────────────────────────────────────────────────────────────
      function showModal(title, body, onConfirm, customButtons) {
        document.getElementById("modal-title").textContent = title;
        document.getElementById("modal-body").textContent = body;
        const actions = document.getElementById("modal-actions");
        if (customButtons) {
          const cancelBtn = document.createElement("button");
          cancelBtn.className = "modal-btn modal-btn-cancel";
          cancelBtn.textContent = "Cancel";
          cancelBtn.onclick = closeModal;
          actions.innerHTML = "";
          actions.appendChild(cancelBtn);
          customButtons.forEach((b) => {
            const btn = document.createElement("button");
            btn.className = "modal-btn modal-btn-danger";
            btn.style.background = "var(--accent2)";
            btn.textContent = b.label;
            btn.onclick = () => {
              closeModal();
              b.action();
            };
            actions.appendChild(btn);
          });
        } else {
          actions.innerHTML =
            '<button class="modal-btn modal-btn-cancel" onclick="closeModal()">Cancel</button>' +
            '<button class="modal-btn modal-btn-danger" id="modal-confirm-btn">Delete</button>';
          document.getElementById("modal-confirm-btn").onclick = () => {
            closeModal();
            onConfirm && onConfirm();
          };
        }
        document.getElementById("modal-overlay").classList.add("open");
      }
      function closeModal() {
        document.getElementById("modal-overlay").classList.remove("open");
      }
      document
        .getElementById("modal-overlay")
        .addEventListener("click", function (e) {
          if (e.target === this) closeModal();
        });

      // ── PDF Preview ───────────────────────────────────────────────────────────────
      async function openPdfPreview(file) {
        try {
          showToast("Opening PDF...", 1500);
          const fd = new FormData();
          fd.append("file", file, file.name);
          const r = await fetch("/api/preview-upload", {
            method: "POST",
            body: fd,
          });
          if (!r.ok) {
            showToast("Failed to open PDF");
            return;
          }
          const { id } = await r.json();
          window.open("/api/preview/" + id + "?token=" + encodeURIComponent(localStorage.getItem("app_token") || ""), "_blank");
        } catch (e) {
          showToast("Failed to open PDF: " + e.message);
        }
      }

      function showFilePreviewModal(filename, content) {
        // reuse same modal elements used in openPdfPreview
        const modal = document.getElementById("pdfPreviewModal");   // same id used there
        const title = document.getElementById("pdfPreviewTitle");
        const body = document.getElementById("pdfPreviewBody");     // where iframe was inserted

        title.textContent = filename;

        // 🔥 Replace iframe with <pre>
        body.innerHTML = `
          <pre style="
            white-space: pre-wrap;
            overflow: auto;
            max-height: 80vh;
            font-family: monospace;
            font-size: 13px;
          ">${escHtml(content)}</pre>
        `;

        modal.style.display = "flex"; // same as openPdfPreview
      }

      // ── Lightbox ──────────────────────────────────────────────────────────────────
      function openLightbox(src) {
        document.getElementById("lightbox-img").src = src;
        document.getElementById("lightbox").classList.add("open");
      }
      function closeLightbox() {
        document.getElementById("lightbox").classList.remove("open");
      }

      // ── Markdown ──────────────────────────────────────────────────────────────────
      marked.setOptions({ breaks: true, gfm: true });
      const renderer = new marked.Renderer();
      renderer.code = function (code, lang) {
        const language = lang || "plaintext";
        let highlighted;
        try {
          highlighted = hljs.getLanguage(language)
            ? hljs.highlight(code, { language }).value
            : hljs.highlightAuto(code).value;
        } catch {
          highlighted = escHtml(code);
        }
        return (
          '<pre><div class="code-header"><span>' +
          escHtml(language) +
          '</span><button class="copy-btn" onclick="copyCode(this)">📋 Copy</button></div><code class="hljs language-' +
          escHtml(language) +
          '">' +
          highlighted +
          "</code></pre>"
        );
      };
      marked.use({ renderer });
      function renderMarkdown(text) {
        try {
          return DOMPurify.sanitize(marked.parse(text || ""));
        } catch {
          return escHtml(text || "");
        }
      }
      async function copyCode(btn) {
        const code = btn.closest("pre").querySelector("code").innerText;
        try {
          await navigator.clipboard.writeText(code);
          const orig = btn.innerHTML;
          btn.innerHTML = "✓ Copied!";
          btn.style.color = "#2ecc71";
          setTimeout(() => {
            btn.innerHTML = orig;
            btn.style.color = "";
          }, 1500);
        } catch {}
      }

      // ── Helpers ───────────────────────────────────────────────────────────────────
      function handleKeyDown(e) {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      }
      function autoResize(el) {
        el.style.height = "auto";
        const minH = window.innerWidth <= 768 ? 44 : 50;
        el.style.height = Math.min(Math.max(el.scrollHeight, minH), 200) + "px";
      }
      function scrollToBottom() {
        const c = document.getElementById("messages-container");
        c.scrollTop = c.scrollHeight;
        if (window._checkScroll) window._checkScroll();
      }
      function scrollToBottomIfNearBottom() {
        if (userPinnedBottom) scrollToBottom();
      }
      function escHtml(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }
      function formatDate(d) {
        const now = new Date(),
          diff = (now - d) / 1000;
        if (diff < 60) return "just now";
        if (diff < 3600) return Math.floor(diff / 60) + "m ago";
        if (diff < 86400) return Math.floor(diff / 3600) + "h ago";
        if (diff < 172800) return "yesterday";
        return d.toLocaleDateString("en-US", {
          month: "short",
          day: "numeric",
        });
      }
      function getWelcomeHTML() {
        return (
          '<div id="welcome"><div class="welcome-logo">✦</div>' +
          '<div class="welcome-title">How can I help you today?</div>' +
          '<div class="welcome-sub">Ask anything. Attach PDFs, code files, or CSVs — I\'ll read and analyze them.</div>' +
          '<div class="welcome-suggestions">' +
          [
            "Explain a concept",
            "Write some code",
            "Review my code",
            "Help me debug",
            "Summarize a document",
            "Brainstorm ideas",
          ]
            .map(
              (s) =>
                '<button class="suggestion-chip" onclick="sendSuggestion(this)">' +
                s +
                "</button>",
            )
            .join("") +
          "</div></div>"
        );
      }
      function showToast(msg, duration) {
        const t = document.getElementById("toast");
        t.textContent = msg;
        t.classList.add("show");
        setTimeout(() => t.classList.remove("show"), duration || 2500);
      }
      function toggleSidebar() {
        document.getElementById("sidebar").classList.toggle("open");
        document.getElementById("sidebar-overlay").classList.toggle("visible");
      }
      function closeSidebar() {
        document.getElementById("sidebar").classList.remove("open");
        document.getElementById("sidebar-overlay").classList.remove("visible");
      }
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          closeLightbox();
          closeModal();
        }
      });

      document.addEventListener("DOMContentLoaded", init);
    </script>
  </body>
</html>
